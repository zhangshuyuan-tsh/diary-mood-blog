<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日记合集</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="nav-wrap">
            <div class="logo">治愈日记小站</div>
            <ul class="nav-list">
                <li><a href="javascript:goPage('index.html')">首页打卡</a ></li>
                <li><a href="javascript:goPage('diary.html')">日记合集</a ></li>
                <li><a href="javascript:goPage('mood.html')">心情统计</a ></li>
                <li><a href="javascript:goPage('message-board.html')">留言板</a ></li>
            </ul>
        </div>
    </header>

    <main>
        <section>
            <h2>日记筛选</h2>
            <div class="form-item">
                <select id="filterMood">
                    <option value="all">全部心情</option>
                    <option value="开心">开心</option>
                    <option value="平淡">平淡</option>
                    <option value="难过">难过</option>
                    <option value="忙碌">忙碌</option>
                    <option value="治愈">治愈</option>
                </select>
            </div>
        </section>
        <section>
            <h2>我的日记卡片</h2>
            <div class="diary-grid" id="diaryWrap">
                <!--JS动态渲染日记卡片-->
            </div>
        </section>
    </main>

    <footer>
        <p>治愈系心情日记 ©2026 ZSY网页设计与开发结课作业</p >
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
