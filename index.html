<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情日记 | 首页打卡</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 访问密码弹窗 -->
    <div id="pwdModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="padding:30px;background:#DCD6CC;border-radius:12px;">
            <h3>请输入访问密码进入系统</h3>
            <input type="password" id="pwdInput" placeholder="默认密码：123456">
            <button id="pwdSubmit" style="margin-top:15px;width:100%;">验证进入</button>
        </div>
    </div>

    <!-- 用户昵称初始化弹窗 -->
    <div id="userModal" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:999;">
        <div style="background:#f8f6f3;padding:30px;border-radius:12px;width:90%;max-width:400px;">
            <h3>欢迎使用心情日记，请设置你的昵称</h3>
            <input type="text" id="userNameInput" placeholder="输入昵称">
            <button id="saveUserBtn" style="margin-top:15px;width:100%;">确认使用</button>
        </div>
    </div>

    <!-- 顶部导航展示当前用户 -->
    <div id="userShow" style="padding:8px 0;text-align:right;color:#fff;"></div>

    <!-- 头部导航 -->
    <header>
        <div class="nav-wrap">
            <div class="logo">治愈日记小站</div>
            <ul class="nav-list">
                <li><a href="javascript:goPage('index.html')">首页打卡</a ></li>
                <li><a href="javascript:goPage('diary.html')">日记合集</a ></li>
                <li><a href="javascript:goPage('mood.html')">心情统计</a ></li>
                <li><a href="javascript:goPage('message-board.html')">留言板</a ></li>
            </ul>
        </div>
    </header>

    <!-- 主体区域 -->
    <main>
        <section>
            <h2>今日治愈语录</h2>
            <div class="banner">
                <div class="banner-text" id="lunbo">慢慢理解世界，慢慢更新自己</div>
            </div>
        </section>

        <section>
            <h2>今日心情打卡</h2>
            <form id="moodForm">
                <div class="form-item">
                    <label>选择今日心情</label>
                    <select id="moodSelect">
                        <option value="开心">开心😊</option>
                        <option value="平淡">平淡☁️</option>
                        <option value="难过">难过💧</option>
                        <option value="忙碌">忙碌💼</option>
                        <option value="治愈">治愈✨</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>简短日记</label>
                    <textarea id="diaryText" rows="4" placeholder="写下今天的小故事..."></textarea>
                </div>
                <button type="submit">保存打卡</button>
            </form>

        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <p>治愈系心情日记 ©2026 ZSY网页设计与开发</p >
    </footer>

    <!-- 引入统一改造后的JS文件，所有逻辑由main.js控制 -->
    <script src="js/main.js"></script>
</body>
</html>
